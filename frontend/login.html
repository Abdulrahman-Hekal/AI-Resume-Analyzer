<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AI Resume Analyzer</title>
  <meta name="description" content="Sign in to your AI Resume Analyzer account.">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar" role="navigation">
    <div class="app-container navbar-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">AI</div>
        <span>Resume Analyzer</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="jobs.html" class="nav-link">Jobs</a></li>
      </ul>

      <div class="nav-user-menu" id="navUserArea"></div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="app-container auth-wrapper">
      <div class="auth-card">
        <div style="text-align: center; margin-bottom: 24px;">
          <h2>Welcome Back</h2>
          <p style="margin-top: 6px; font-size: 0.875rem;">Access your analyzed resumes and career recommendations.</p>
        </div>

        <div id="authErrorBox" class="form-error" style="display:none; padding: 10px; background: var(--danger-bg); border-radius: 6px; margin-bottom: 16px;"></div>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="example@gmail.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--ink-secondary);">
          Don't have an account yet? <a href="register.html" style="font-weight: 600;">Create one here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm")?.addEventListener("submit", Auth.handleLogin);
  </script>
</body>
</html>
